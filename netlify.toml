# checknbalance.org — pure static site, no build step.
# Netlify publishes the repo root as-is on every push to main.
[build]
  publish = "."

# Security headers on every response, including HTML, the 404 page, and assets.
# CSP is enforced (not report-only). script-src and style-src allow 'unsafe-inline'
# because each page is one file: 50 pages carry a large inline <script>, and every
# page carries an inline <style> plus style="" attributes. A static host cannot
# put a fresh nonce on each response. Maps need cdn.jsdelivr.net for d3,
# topojson-client, and the us-atlas JSON fetch. Fonts load from Google.
# ipapi.co is the home-state highlight on the national map (it fails open).
# plausible.io is unused until PLAUSIBLE_DOMAIN is set in analytics.js; it is
# allowed so turning that on does not silently break. d3's bundle contains a
# CSV parser that calls new Function; the pages never call it, so 'unsafe-eval'
# is not allowed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://cdn.jsdelivr.net https://ipapi.co https://plausible.io; form-action 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'"

# California, Missouri, and the District of Columbia do not have their own
# pages yet. Texas does (tx.html, Wave 93). /ca.html (and the bare /ca path)
# were 404s. Send those addresses to the starter or marquee page that already
# works:
#   CA, MO → starter framework
#   DC     → marquee races
#   TX     → tx.html (the four file-shadowing rules are removed; /tx/ /texas
#            still land on the generic page)
#
# 302, not 301: these are temporary. A permanent redirect would stick in
# browsers after a real ca.html is published. force is off, so once that
# file exists Netlify serves the file and ignores the matching rule.
# Delete the four rules for a state in the same commit that adds its page.
#
# A destination that already has ?state= drops any other query string,
# including UTM tags. Promo links should use the real landing URL
# (see docs/UTM-CONVENTION.md), not these aliases.
#
# One redirect file only. Do not add a root `_redirects` — Netlify would
# apply both and the two lists would fight.
#
# Trailing-slash and full-name shortcuts are included because those
# addresses 404 on the live site the same way /ca does. Built states
# already answer at /nc and /nc.html, so they are not listed here.
# The sitemap uses the .html address.

[[redirects]]
  from = "/ca"
  to = "/state.html?state=CA"
  status = 302

[[redirects]]
  from = "/ca.html"
  to = "/state.html?state=CA"
  status = 302

[[redirects]]
  from = "/CA"
  to = "/state.html?state=CA"
  status = 302

[[redirects]]
  from = "/CA.html"
  to = "/state.html?state=CA"
  status = 302

[[redirects]]
