# Hide repo files that are not the website. The force flag is on so Netlify
# returns 404 even though the file sits in the publish directory. These rules
# are AFTER the 302s above, and none of them match /ca, /mo, /tx, /dc, or a real page.
# Asterisks only work at the end of a redirect path (Netlify ignores a
# mid-path star such as /*.md), so whole folders are blocked with a splat and
# root files are named one by one. Do not add analytics.js, the HTML pages,
# sitemap.xml, robots.txt, the favicons, or apple-touch-icon.png here.
# The 302 rules above stay force-off so a future ca.html is served as a file.

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/MIDNIGHT_PUSH_NOTES.md"
  to = "/404.html"
  status = 404
  force = true

